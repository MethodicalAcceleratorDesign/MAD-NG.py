name: Make a MAD-NG Binary

# Binaries from this workflow are not shipped: the PyPI package uses the released binaries.
on:
  workflow_dispatch:
    inputs:
      mad_ng_ref:
        description: MAD-NG branch, tag or commit to build
        default: master

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Clone MAD-NG
        uses: actions/checkout@v5
        with:
          repository: MethodicalAcceleratorDesign/MAD-NG
          ref: ${{ inputs.mad_ng_ref }}
          path: MAD
          submodules: recursive

      # Rocky Linux 9 keeps the glibc requirement of the binary low
      - name: Build MAD-NG in Rocky Linux 9
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work rockylinux:9 bash -c '
            set -euo pipefail
            dnf install -y dnf-plugins-core
            dnf config-manager --enable crb
            dnf install -y gcc gcc-c++ gcc-gfortran make cmake git curl tar gzip \
              libquadmath-devel libquadmath-static libgfortran-static libstdc++-static
            tools/build_madng.sh MAD
          '

      - uses: actions/upload-artifact@v4
        with:
          name: mad-Linux
          path: MAD/src/mad

  build-macos-arm64:
    runs-on: macos-15
    env:
      DEPS: ${{ github.workspace }}/madng-deps
    steps:
      - uses: actions/checkout@v5

      - name: Clone MAD-NG
        uses: actions/checkout@v5
        with:
          repository: MethodicalAcceleratorDesign/MAD-NG
          ref: ${{ inputs.mad_ng_ref }}
          path: MAD
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: madng-deps
          key: madng-deps-macos-arm64-${{ hashFiles('tools/build_madng.sh') }}

      - run: brew install gcc cmake

      - name: Build MAD-NG
        run: tools/build_madng.sh MAD

      - uses: actions/upload-artifact@v4
        with:
          name: mad-Darwin
          path: MAD/src/mad

  test:
    needs: [build-linux, build-macos-arm64]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, artifact: mad-Linux, name: mad_Linux}
          - {os: macos-15, artifact: mad-Darwin, name: mad_Darwin}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: built

      - name: Use the built binary
        run: |
          mkdir -p src/pymadng/bin
          install -m 755 built/mad src/pymadng/bin/${{ matrix.name }}

      - run: python -m pip install -e .[tfs,test,jupyter]

      # test_logfile compares the log with the MAD-NG version of the released binary
      - run: python -m pytest --deselect tests/test_debug.py::test_logfile
