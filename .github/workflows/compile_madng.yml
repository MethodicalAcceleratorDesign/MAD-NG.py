name: Make a MAD-NG Binary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Allow release workflows to build and consume these exact binaries.
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone MAD-NG
        uses: actions/checkout@v4
        with:
          repository: MethodicalAcceleratorDesign/MAD-NG
          path: MAD
          submodules: recursive

      - name: Build MAD-NG in Rocky Linux 9
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            rockylinux:9 \
            bash -lc '
              set -euo pipefail

              dnf install -y dnf-plugins-core
              dnf config-manager --enable crb
              dnf install -y \
                gcc gcc-c++ gcc-gfortran make cmake git \
                libquadmath-devel libquadmath-static \
                libgfortran-static libstdc++-static \
                diffutils findutils sed which tar gzip

              cp MAD/src/Makefile.lxplus MAD/src/Makefile
              sed -i \
                -e '"'"'s#^CC[[:space:]]*=.*#CC=gcc#g'"'"' \
                -e '"'"'s#^CXX[[:space:]]*=.*#CXX=g++#g'"'"' \
                -e '"'"'s#-fdiagnostics-all-candidates##g'"'"' \
                MAD/src/Makefile || true

              mkdir -p MAD/tools
              cp -f tools/build_madng_deps_linux.sh MAD/tools/
              chmod +x MAD/tools/build_madng_deps_linux.sh
              (cd MAD && JOBS="$(nproc)" CC=gcc CXX=g++ FC=gfortran AR=ar RANLIB=ranlib ./tools/build_madng_deps_linux.sh)

              cd MAD/src
              export CC=gcc CXX=g++
              gcc_libdir="$(gcc -print-libgcc-file-name | xargs dirname)"
              export LIBRARY_PATH="${gcc_libdir}${LIBRARY_PATH:+:${LIBRARY_PATH}}"
              export LDOPTIONS="-no-pie"

              make SHELL=/bin/bash \
                CC="${CC}" CXX="${CXX}" \
                LDOPTIONS="${LDOPTIONS:-}"

              chmod 755 mad
            '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mad-Linux
          path: MAD/src/mad

  build-macos-arm64:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone MAD-NG
        uses: actions/checkout@v4
        with:
          repository: MethodicalAcceleratorDesign/MAD-NG
          path: MAD
          submodules: recursive

      - name: Install build tools
        run: |
          brew install gcc cmake automake autoconf libtool pkg-config curl

      - name: Select native compiler toolchain
        run: |
          set -euo pipefail

          gcc_bin="$(ls /opt/homebrew/bin/gcc-[0-9]* | sort -V | tail -n1)"
          ver="${gcc_bin##*-}"

          {
            echo "CC=gcc-${ver}"
            echo "CXX=g++-${ver}"
            echo "FC=gfortran-${ver}"
            echo "MACOSX_DEPLOYMENT_TARGET=14"
          } >> "${GITHUB_ENV}"

      - name: Build native MAD-NG dependencies (lib/README.md)
        env:
          MAD_ROOT: ${{ github.workspace }}/MAD
        run: |
          set -euo pipefail

          echo "== Toolchain =="
          which "${CC}"; "${CC}" --version
          which "${CXX}"; "${CXX}" --version
          which "${FC}"; "${FC}" --version

          export MAD_BIN="${MAD_ROOT}/bin/macosx"
          export MAD_DEPS="${RUNNER_TEMP}/mad-deps"
          mkdir -p "${MAD_BIN}" "${MAD_DEPS}"
          JOBS="$(sysctl -n hw.ncpu)"

          cd "${MAD_DEPS}"
          git clone --depth 1 --branch mad-patch https://github.com/MethodicalAcceleratorDesign/LuaJIT.git luajit
          git clone --depth 1 https://github.com/MethodicalAcceleratorDesign/luafilesystem.git lfs
          git clone --depth 1 --branch v3.12.1 https://github.com/Reference-LAPACK/lapack.git lapack
          git clone --depth 1 --branch v2.7.1 https://github.com/stevengj/nlopt.git nlopt
          curl -fsSL -o fftw-3.3.10.tar.gz https://www.fftw.org/fftw-3.3.10.tar.gz
          curl -fsSL -o nfft-3.5.3.tar.gz https://www-user.tu-chemnitz.de/~potts/nfft/download/nfft-3.5.3.tar.gz
          curl -fsSL -o lpeg-1.1.0.tar.gz http://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz
          tar xzf fftw-3.3.10.tar.gz
          tar xzf nfft-3.5.3.tar.gz
          tar xzf lpeg-1.1.0.tar.gz

          echo "== LuaJIT =="
          cd "${MAD_DEPS}/luajit"
          make clean
          make -j"${JOBS}" amalg PREFIX="$(pwd)" CC="${CC}"
          make install PREFIX="$(pwd)"
          cp -f src/libluajit.a "${MAD_BIN}/"

          echo "== FFTW3 =="
          cd "${MAD_DEPS}/fftw-3.3.10"
          CC="${CC}" CFLAGS='-O3 -fPIC' ./configure --disable-shared --enable-static
          make -j"${JOBS}"
          cp -f .libs/libfftw3.a "${MAD_BIN}/"

          echo "== LuaFileSystem =="
          cd "${MAD_DEPS}/lfs"
          make clean || true
          make lfs.a CC="${CC}" AR=ar CFLAGS="-O3 -fPIC -I${MAD_DEPS}/luajit/src"
          cp -f liblfs.a "${MAD_BIN}/"

          echo "== LPeg =="
          cd "${MAD_DEPS}/lpeg-1.1.0"
          make clean || true
          make -j"${JOBS}" CC="${CC}" LUADIR="${MAD_DEPS}/luajit/src" COPT='-O3 -DNDEBUG' \
            lpvm.o lpcap.o lptree.o lpcode.o lpprint.o lpcset.o
          ar -rcs liblpeg.a lpvm.o lpcap.o lptree.o lpcode.o lpprint.o lpcset.o
          cp -f liblpeg.a "${MAD_BIN}/"

          echo "== NLopt =="
          cd "${MAD_DEPS}/nlopt"
          cmake -S . -B build-arm64 -DBUILD_SHARED_LIBS=OFF -DNLOPT_CXX=OFF -DNLOPT_FORTRAN=OFF \
            -DCMAKE_C_COMPILER="${CC}" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake --build build-arm64 -j"${JOBS}"
          cp -f build-arm64/libnlopt.a "${MAD_BIN}/"

          echo "== LAPACK and reference BLAS =="
          cd "${MAD_DEPS}/lapack"
          cmake -S . -B build-arm64 -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER="${CC}" -DCMAKE_Fortran_COMPILER="${FC}" -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-arm64 -j"${JOBS}" --target blas lapack
          cp -f build-arm64/lib/libblas.a "${MAD_BIN}/librefblas.a"
          cp -f build-arm64/lib/liblapack.a "${MAD_BIN}/"

          echo "== NFFT3 =="
          cd "${MAD_DEPS}/nfft-3.5.3"
          CC="${CC}" CFLAGS='-O3 -fPIC' ./configure --enable-all --disable-shared \
            --with-fftw3="${MAD_DEPS}/fftw-3.3.10" \
            --with-fftw3-libdir="${MAD_DEPS}/fftw-3.3.10/.libs" \
            --with-fftw3-includedir="${MAD_DEPS}/fftw-3.3.10/api"
          make -j"${JOBS}"
          cp -f .libs/libnfft3.a "${MAD_BIN}/"

          echo "== Verify native archives =="
          lipo -info "${MAD_BIN}"/*.a

      - name: Compile MAD-NG
        working-directory: MAD/src
        env:
          MAD_DEPS: ${{ runner.temp }}/mad-deps
        run: |
          echo "== Toolchain =="
          which "${CC}"; "${CC}" --version
          which "${CXX}"; "${CXX}" --version
          which "${FC}"; "${FC}" --version

          make -f Makefile.macosx clean
          make -f Makefile.macosx SHELL=/bin/bash CC="${CC}" CXX="${CXX}" FC="${FC}" LIB="${MAD_DEPS}"
          lipo -info mad
          chmod 755 mad

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mad-macOS-arm64
          path: MAD/src/mad
